- label: 'Test RayService Incremental Upgrade E2E (nightly operator)'
  instance_size: large
  image: golang:1.26-bookworm
  commands:
    - source .buildkite/setup-env.sh
    - kind create cluster --wait 900s --config ./ci/kind-config-buildkite.yml
    - kubectl config set clusters.kind-kind.server https://docker:6443

    # Install Gateway API CRDs (Required for Incremental Upgrade)
    - kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml

    # Install Istio Gateway controller and create GatewayClass
    - echo "--- Installing Istio (Gateway Controller)"
    - curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.28.3 sh -
    - ./istio-1.28.3/bin/istioctl install --set profile=minimal -y
    - echo "--- Creating Istio GatewayClass"
    - kubectl wait --namespace istio-system --for=condition=ready pod --selector=app=istiod --timeout=120s
    - kubectl apply -f ray-operator/config/samples/gateway-api/istio-class.yaml

    # Build nightly KubeRay operator image
    - pushd ray-operator
    - source ../.buildkite/build-start-operator.sh
    - kubectl wait --timeout=90s --for=condition=Available=true deployment kuberay-operator

    # Run E2E Tests
    - echo "--- START:Running RayService Incremental Upgrade E2E (nightly operator) tests"
    - if [ -n "$${KUBERAY_TEST_RAY_IMAGE}" ]; then echo "Using Ray Image $${KUBERAY_TEST_RAY_IMAGE}"; fi
    - set -o pipefail
    - mkdir -p "$(pwd)/tmp" && export KUBERAY_TEST_OUTPUT_DIR=$(pwd)/tmp
    - echo "KUBERAY_TEST_OUTPUT_DIR=$$KUBERAY_TEST_OUTPUT_DIR"
    - KUBERAY_TEST_TIMEOUT_SHORT=1m KUBERAY_TEST_TIMEOUT_MEDIUM=10m KUBERAY_TEST_TIMEOUT_LONG=20m go test -timeout 60m -v ./test/e2eincrementalupgrade 2>&1 | awk -f ../.buildkite/format.awk | tee $$KUBERAY_TEST_OUTPUT_DIR/gotest.log || (kubectl logs --tail -1 -l app.kubernetes.io/name=kuberay | tee $$KUBERAY_TEST_OUTPUT_DIR/kuberay-operator.log && cd $$KUBERAY_TEST_OUTPUT_DIR && find . -name "*.log" | tar -cf /artifact-mount/e2e-log.tar -T - && exit 1)
    - echo "--- END:RayService Incremental Upgrade E2E (nightly operator) tests finished"

- label: 'Test RayService Incremental Upgrade Blue/Green Flaky Repro-1'
  # repro-ci: deterministic fail-before repro for the instant-cutover race in
  # https://github.com/ray-project/kuberay/issues/4783 (oldVersionServed can stay
  # false when the upgrade completes before the first test request is made).
  # Independent run 1/50.
  # DO NOT MERGE.
  instance_size: large
  image: golang:1.26-bookworm
  commands:
    - source .buildkite/setup-env.sh
    - kind create cluster --wait 900s --config ./ci/kind-config-buildkite.yml
    - kubectl config set clusters.kind-kind.server https://docker:6443

    # Install Gateway API CRDs (Required for Incremental Upgrade)
    - kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml

    # Install Istio Gateway controller and create GatewayClass
    - echo "--- Installing Istio (Gateway Controller)"
    - curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.28.3 sh -
    - ./istio-1.28.3/bin/istioctl install --set profile=minimal -y
    - echo "--- Creating Istio GatewayClass"
    - kubectl wait --namespace istio-system --for=condition=ready pod --selector=app=istiod --timeout=120s
    - kubectl apply -f ray-operator/config/samples/gateway-api/istio-class.yaml

    # Build nightly KubeRay operator image
    - pushd ray-operator
    - source ../.buildkite/build-start-operator.sh
    - kubectl wait --timeout=90s --for=condition=Available=true deployment kuberay-operator

    # Run BlueGreen Test (test code waits for the upgrade to fully complete before the first request to force the race)
    - echo "--- START:Running RayService Incremental Upgrade Blue/Green flaky repro 1/50 (nightly operator) tests"
    - if [ -n "$${KUBERAY_TEST_RAY_IMAGE}" ]; then echo "Using Ray Image $${KUBERAY_TEST_RAY_IMAGE}"; fi
    - set -o pipefail
    - mkdir -p "$(pwd)/tmp" && export KUBERAY_TEST_OUTPUT_DIR=$(pwd)/tmp
    - echo "KUBERAY_TEST_OUTPUT_DIR=$$KUBERAY_TEST_OUTPUT_DIR"
    - KUBERAY_TEST_TIMEOUT_SHORT=1m KUBERAY_TEST_TIMEOUT_MEDIUM=10m KUBERAY_TEST_TIMEOUT_LONG=20m go test -count=1 -timeout 60m -v ./test/e2eincrementalupgrade -run '^TestRayServiceIncrementalUpgrade$/BlueGreen$' 2>&1 | awk -f ../.buildkite/format.awk | tee $$KUBERAY_TEST_OUTPUT_DIR/gotest.log || (kubectl logs --tail -1 -l app.kubernetes.io/name=kuberay | tee $$KUBERAY_TEST_OUTPUT_DIR/kuberay-operator.log && cd $$KUBERAY_TEST_OUTPUT_DIR && find . -name "*.log" | tar -cf /artifact-mount/e2e-log.tar -T - && exit 1)
    - echo "--- END:RayService Incremental Upgrade Blue/Green flaky repro 1/50 (nightly operator) tests finished"
