version: 2.1

orbs:
  architect: giantswarm/architect@10.11.1

workflows:
  build:
    jobs:
      - architect/push-to-app-catalog:
          name: push-to-giantswarm-catalog
          context: architect
          executor: app-build-suite
          chart: kuberay
          # Keep the appVersion declared in Chart.yaml: it names the upstream
          # KubeRay release the chart deploys, not the GS chart tag.
          override_app_version: false
          app_catalog: giantswarm-catalog
          app_catalog_test: giantswarm-test-catalog
          filters:
            branches:
              ignore:
                - main
                - master
            tags:
              only: /^v.*/
