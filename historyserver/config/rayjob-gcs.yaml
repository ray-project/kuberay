# Apply with envsubst to substitute environment variables:
#   envsubst < historyserver/config/rayjob-gcs.yaml | kubectl apply -f -
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: rayjob-historyserver-gcs
  namespace: default
spec:
  entrypoint: python /home/ray/samples/sample_code.py
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  rayClusterSpec:
    rayVersion: "2.56.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: 0.0.0.0
        num-cpus: "0"
      serviceType: ClusterIP
      template:
        metadata:
          labels:
            test: rayjob-historyserver-gcs
        spec:
          serviceAccountName: historyserver
          imagePullSecrets:
          affinity:
          containers:
          - env:
            - name: RAY_TMP_ROOT
              value: &rayTmpRoot /tmp/ray
            - name: RAY_enable_ray_event
              value: "true"
            - name: RAY_enable_core_worker_ray_event_to_aggregator
              value: "true"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
              value: "http://localhost:8084/v1/events"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
              value: "ALL"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_PUBLISHER_HTTP_ENDPOINT_EXPOSABLE_EVENT_TYPES
              value: "ALL"
            image: rayproject/ray:2.56.0
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: true
              privileged: true
            name: ray-head
            resources:
              limits:
                cpu: "6"
                memory: 10G
              requests:
                cpu: "50m"
                memory: 1G
            volumeMounts:
            - name: historyserver
              mountPath: *rayTmpRoot
            - name: code-sample
              mountPath: /home/ray/samples
          - name: collector
            image: quay.io/kuberay/collector:nightly
            imagePullPolicy: Always
            env:
            - name: RAY_CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['ray.io/cluster']
            - name: RAY_CLUSTER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FQ_RAY_IP
              value: $(RAY_CLUSTER_NAME)-head-svc.$(RAY_CLUSTER_NAMESPACE).svc.cluster.local
            - name: RAY_TMP_ROOT
              value: *rayTmpRoot
            - name: GCS_BUCKET
              value: "${GCS_BUCKET}"
            # RAY_DASHBOARD_ADDRESS is used by the head collector to fetch endpoints' results
            # (e.g., /api/v0/cluster_metadata) from the Ray Dashboard running in the same pod.
            # Only the head collector uses this; worker collectors do not need it.
            # If your Ray Dashboard uses a non-default port (not 8265), update this value accordingly.
            - name: RAY_DASHBOARD_ADDRESS
              value: "http://localhost:8265"
            # RAY_COLLECTOR_ADDITIONAL_ENDPOINTS is a comma-separated list of Ray Dashboard
            # API endpoint paths that the head collector will periodically poll and store.
            # Use this for endpoints whose data cannot be obtained via Ray events.
            # You can add more endpoints, e.g., "/api/v0/placement_groups,/api/serve/applications/"
            # Note: Only static endpoints (no dynamic path parameters like {job_id}) are supported.
            - name: RAY_COLLECTOR_ADDITIONAL_ENDPOINTS
              value: "/api/v0/placement_groups?detail=1&limit=10000"
              # Query params must match the Ray Dashboard frontend request exactly
              # (see https://github.com/ray-project/ray/blob/cb9c80fee6a700efe61ea97987248ce82e3fa2e2/python/ray/dashboard/client/src/service/placementGroup.ts):
              #   detail=1    — include bundles and stats fields required by PlacementGroupTable
              #   limit=10000 — match the frontend's default limit to avoid truncation
            # RAY_COLLECTOR_POLL_INTERVAL controls how often the collector polls the additional
            # endpoints above. Accepts Go duration format (e.g., "30s", "1m", "5m").
            - name: RAY_COLLECTOR_POLL_INTERVAL
              value: "30s"
            - name: RAY_ROLE
              value: "Head"
            - name: OWNER_KIND
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['ray.io/originated-from-crd']
            - name: OWNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['ray.io/originated-from-cr-name']
            - name: STORAGE_BACKEND
              value: "gcs"
            - name: RAY_ROOT_DIR
              value: "storage-root"
            - name: EVENTS_PORT
              value: "8084"
            volumeMounts:
            - name: historyserver
              mountPath: *rayTmpRoot
          tolerations:
          - key: ray
            operator: Equal
            value: cpu
          volumes:
          - name: historyserver
            emptyDir: {}
          - name: code-sample
            configMap:
              name: ray-job-code-sample
              items:
              - key: sample_code.py
                path: sample_code.py
    workerGroupSpecs:
    - groupName: cpu
      maxReplicas: 1000
      minReplicas: 1
      numOfHosts: 1
      rayStartParams: {}
      replicas: 1
      template:
        metadata:
          labels:
            test: rayjob-historyserver-gcs
        spec:
          serviceAccountName: historyserver
          containers:
          - env:
            - name: RAY_TMP_ROOT
              value: *rayTmpRoot
            - name: RAY_enable_ray_event
              value: "true"
            - name: RAY_enable_core_worker_ray_event_to_aggregator
              value: "true"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
              value: "http://localhost:8084/v1/events"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
              value: "ALL"
            - name: RAY_DASHBOARD_AGGREGATOR_AGENT_PUBLISHER_HTTP_ENDPOINT_EXPOSABLE_EVENT_TYPES
              value: "ALL"
            image: rayproject/ray:2.56.0
            imagePullPolicy: IfNotPresent
            name: ray-worker
            securityContext:
              allowPrivilegeEscalation: true
              privileged: true
            resources:
              limits:
                cpu: "2"
                memory: 2G
              requests:
                cpu: "50m"
                memory: 1G
            volumeMounts:
            - name: historyserver
              mountPath: *rayTmpRoot
          - name: collector
            image: quay.io/kuberay/collector:nightly
            imagePullPolicy: Always
            env:
            - name: RAY_CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['ray.io/cluster']
            - name: RAY_CLUSTER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FQ_RAY_IP
              value: $(RAY_CLUSTER_NAME)-head-svc.$(RAY_CLUSTER_NAMESPACE).svc.cluster.local
            - name: RAY_TMP_ROOT
              value: *rayTmpRoot
            - name: GCS_BUCKET
              value: "${GCS_BUCKET}"
            - name: RAY_ROLE
              value: "Worker"
            - name: OWNER_KIND
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['ray.io/originated-from-crd']
            - name: OWNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['ray.io/originated-from-cr-name']
            - name: STORAGE_BACKEND
              value: "gcs"
            - name: RAY_ROOT_DIR
              value: "storage-root"
            - name: EVENTS_PORT
              value: "8084"
            volumeMounts:
            - name: historyserver
              mountPath: *rayTmpRoot
          tolerations:
          - key: ray
            operator: Equal
            value: cpu
          volumes:
          - name: historyserver
            emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-job-code-sample
data:
  sample_code.py: |
    import ray
    import time
    from ray.util.placement_group import placement_group

    ray.init()

    # --- Scenario 1: Root-level NORMAL_TASK (single call) ---
    @ray.remote(num_cpus=0.1)
    def my_task(x):
        # NOTE: Add this to ensure will produce log.out
        print(f"Processing {x}", flush=True)
        return x * 2

    # --- Scenario 2: Nested tasks (parent spawns child) ---
    # Tests lineage tree depth > 1: child_task is nested under parent_task.
    @ray.remote(num_cpus=0.1)
    def parent_task():
        result = ray.get(child_task.remote())
        return result

    @ray.remote(num_cpus=0.1)
    def child_task():
        print("Child task", flush=True)
        return 42

    # --- Scenario 3: Multiple same-name tasks ---
    # Tests GROUP merging in lineage: 3 calls to the same function
    # are merged into a single GROUP node.
    @ray.remote(num_cpus=0.1)
    def repeated_task(x):
        return x

    # --- Scenario 4: Actor (creation + method calls) ---
    @ray.remote(num_cpus=0.1)
    class Counter:
        def __init__(self):
            self.count = 0

        def increment(self):
            self.count += 1
            return self.count

        def get_count(self):
            return self.count

    # Execute all scenarios:
    task_result = ray.get(my_task.remote(1))
    print(f"Task result: {task_result}")

    nested_result = ray.get(parent_task.remote())
    print(f"Nested result: {nested_result}")

    refs = [repeated_task.remote(i) for i in range(3)]
    results = ray.get(refs)
    print(f"Repeated results: {results}")

    counter = Counter.remote()
    for i in range(2):
        count = ray.get(counter.increment.remote())
        print(f"Counter: {count}")
    final_count = ray.get(counter.get_count.remote())
    print(f"Final count: {final_count}")

    print(f"Cluster resources: {ray.cluster_resources()}")

    # Create a detached placement group so it persists after the job exits.
    # This ensures the collector captures non-empty data when polling /api/v0/placement_groups.
    pg = placement_group([{"CPU": 0.5}], strategy="SPREAD", lifetime="detached", name="test_pg")
    ray.get(pg.ready())
    print(f"Placement group created: {pg.bundle_specs}")

    # Wait for events to flush to the collector
    time.sleep(5)
