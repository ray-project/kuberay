apiVersion: v1
kind: Service
metadata:
  name: historyserver #TODO: to specify your service name
  labels:
    app: historyserver
spec:
  selector:
    app: historyserver
  ports:
  - protocol: TCP
    name: http
    port: 30080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historyserver-demo
  labels:
    app: historyserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historyserver
  template:
    metadata:
      labels:
        app: historyserver
    spec:
      serviceAccountName: historyserver
      containers:
      - name: historyserver
        env:
          - name: S3DISABLE_SSL
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            value: minioadmin
          - name: AWS_SECRET_ACCESS_KEY
            value: minioadmin
          - name: AWS_SESSION_TOKEN
            value: ""
          - name: S3_BUCKET
            value: "ray-historyserver"
          - name: S3_ENDPOINT
            value: "minio-service.minio-dev:9000"
          - name: S3_REGION
            value: "test"
          - name: S3FORCE_PATH_STYLE
            value: "true"
          - name: STORAGE_BACKEND
            value: "s3"
        image: historyserver:v0.1.0
        imagePullPolicy: IfNotPresent
        # Enable proxying to live RayClusters with token authentication enabled.
        # The history server reads the auth Secret and forwards requests with the
        # appropriate authorization header. Requires the RBAC in
        # service_account_auth_token_mode.yaml.
        # command:
        # - historyserver
        # - --use-auth-token-mode=true
        ports:
        - containerPort: 8080
        args:
        # We store Go structs in the cache but estimate their size by JSON length, and the actual heap size can be ~2.5x the estimate.
        # Set the cache soft bound to 4 GiB. The worst-case usage is 4 GiB * 2.5 = 10 GiB, leaving ~2 GiB of the 12 GiB limit as headroom.
        # Ref for the estimate: https://github.com/ray-project/kuberay/pull/5208#discussion_r3890261932
        - --session-cache-max-memory=4Gi
        # The 2 GiB request keeps examples schedulable; size production requests to residency.
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            memory: "12Gi"
