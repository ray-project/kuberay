apiVersion: ray.io/v1
kind: RayCluster
metadata:
  labels:
    ray.io/cluster: raycluster-historyserver-k8sauth
  name: raycluster-historyserver-k8sauth
spec:
  # enableK8sTokenAuth requires Ray 2.55.0+. authOptions.secretName must NOT be
  # set at the same time.
  rayVersion: '2.55.0'
  authOptions:
    mode: 'token'
    enableK8sTokenAuth: true
  historyServerOptions:
    collectorOptions:
      image: collector:v0.1.0
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: "200m"
          memory: "256Mi"
        requests:
          cpu: "50m"
          memory: "64Mi"
      env:
      - name: STORAGE_BACKEND
        value: "s3"
      - name: RAY_ROOT_DIR
        value: "log"
      - name: S3DISABLE_SSL
        value: "true"
      - name: AWS_ACCESS_KEY_ID
        value: minioadmin
      - name: AWS_SECRET_ACCESS_KEY
        value: minioadmin
      - name: AWS_SESSION_TOKEN
        value: ""
      - name: S3_BUCKET
        value: "ray-historyserver"
      - name: S3_ENDPOINT
        value: "minio-service.minio-dev:9000"
      - name: S3_REGION
        value: "test"
      - name: S3FORCE_PATH_STYLE
        value: "true"
  headGroupSpec:
    rayStartParams:
      dashboard-host: 0.0.0.0
      num-cpus: "0"
    template:
      spec:
        serviceAccountName: raycluster-historyserver-k8sauth
        containers:
        - name: ray-head
          imagePullPolicy: IfNotPresent
          image: rayproject/ray:2.55.0
          env:
          - name: RAY_TMP_ROOT
            value: &rayTmpRoot /tmp/ray
          - name: RAY_enable_ray_event
            value: "true"
          - name: RAY_enable_core_worker_ray_event_to_aggregator
            value: "true"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
            value: "http://localhost:8084/v1/events"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_PUBLISHER_HTTP_ENDPOINT_EXPOSABLE_EVENT_TYPES
            value: &eventTypes "TASK_DEFINITION_EVENT,TASK_LIFECYCLE_EVENT,ACTOR_TASK_DEFINITION_EVENT,
                    TASK_PROFILE_EVENT,DRIVER_JOB_DEFINITION_EVENT,DRIVER_JOB_LIFECYCLE_EVENT,
                    ACTOR_DEFINITION_EVENT,ACTOR_LIFECYCLE_EVENT,NODE_DEFINITION_EVENT,NODE_LIFECYCLE_EVENT"
          resources:
            limits:
              cpu: "5"
              memory: "10Gi"
            requests:
              cpu: "50m"
              memory: "1Gi"
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
  workerGroupSpecs:
  - replicas: 1
    minReplicas: 1
    maxReplicas: 5
    groupName: workergroup
    rayStartParams: {}
    template:
      spec:
        serviceAccountName: raycluster-historyserver-k8sauth
        containers:
        - name: ray-worker
          imagePullPolicy: IfNotPresent
          image: rayproject/ray:2.55.0
          env:
          - name: RAY_TMP_ROOT
            value: *rayTmpRoot
          - name: RAY_enable_ray_event
            value: "true"
          - name: RAY_enable_core_worker_ray_event_to_aggregator
            value: "true"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_EVENTS_EXPORT_ADDR
            value: "http://localhost:8084/v1/events"
          - name: RAY_DASHBOARD_AGGREGATOR_AGENT_PUBLISHER_HTTP_ENDPOINT_EXPOSABLE_EVENT_TYPES
            value: *eventTypes
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "50m"
              memory: "1Gi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raycluster-historyserver-k8sauth
---
# The Ray Dashboard runs TokenReview/SubjectAccessReview to validate incoming
# tokens, so the cluster's ServiceAccount needs permission to create them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ray-authenticator
rules:
- apiGroups: ["authentication.k8s.io"]
  resources:
  - 'tokenreviews'
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources:
  - 'subjectaccessreviews'
  verbs: ["create"]
---
# Grants the caller ray:write on rayclusters, which is what the Dashboard
# authorizes the presented token against.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ray-writer
rules:
- apiGroups: ["ray.io"]
  resources:
  - 'rayclusters'
  verbs: ["ray:write"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ray-authenticator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ray-authenticator
subjects:
- kind: ServiceAccount
  name: raycluster-historyserver-k8sauth
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raycluster-historyserver-k8sauth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ray-writer
subjects:
- kind: ServiceAccount
  name: raycluster-historyserver-k8sauth
  namespace: default
