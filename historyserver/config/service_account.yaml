apiVersion: v1
kind: ServiceAccount
metadata:
  name: historyserver
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: raycluster-reader
rules:
- apiGroups: ["ray.io"]
  resources: ["rayclusters"]
  verbs: ["list", "get"]
# services/proxy is needed only with --use-kubernetes-proxy, which reaches a
# live cluster's dashboard through the API server rather than dialing the head
# Service directly. The direct path resolves the head Service by short name, so
# it only works when the History Server runs in the same namespace as the Ray
# cluster; the API server proxy URL carries the namespace and therefore works
# across namespaces, which is the usual production layout.
- apiGroups: [""]
  resources: ["services/proxy"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: historyserver
subjects:
- kind: ServiceAccount
  name: historyserver
  namespace: default
roleRef:
  kind: ClusterRole
  name: raycluster-reader
