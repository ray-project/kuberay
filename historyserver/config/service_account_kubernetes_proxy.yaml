# Apply this file ONLY when --use-kubernetes-proxy is enabled in the history
# server configuration. It lets the history server reach live clusters'
# dashboards through the Kubernetes API server proxy instead of dialing the
# namespace-qualified head Service directly. The direct path works across
# namespaces without any extra permission.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: raycluster-kubernetes-proxy
rules:
- apiGroups: [""]
  resources: ["services/proxy"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: historyserver-kubernetes-proxy
subjects:
- kind: ServiceAccount
  name: historyserver
  namespace: default
roleRef:
  kind: ClusterRole
  name: raycluster-kubernetes-proxy
  apiGroup: rbac.authorization.k8s.io
