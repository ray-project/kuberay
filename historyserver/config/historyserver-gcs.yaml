# Apply with envsubst to substitute environment variables:
#   envsubst < historyserver/config/historyserver-gcs.yaml | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: historyserver
  labels:
    app: historyserver
spec:
  selector:
    app: historyserver
  ports:
  - protocol: TCP
    name: http
    port: 30080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historyserver-demo
  labels:
    app: historyserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historyserver
  template:
    metadata:
      labels:
        app: historyserver
    spec:
      serviceAccountName: historyserver
      containers:
      - name: historyserver
        env:
          - name: GCS_BUCKET
            value: "${GCS_BUCKET}"
          - name: STORAGE_BACKEND
            value: "gcs"
        image: ${HISTORY_SERVER_IMAGE}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        args:
        # We store Go structs in the cache but estimate their size by JSON length, and the actual heap size can be ~2.5x the estimate.
        # Set the cache soft bound to 4 GiB. The worst-case usage is 4 GiB * 2.5 = 10 GiB, leaving ~2 GiB of the 12 GiB limit as headroom.
        # Ref for the estimate: https://github.com/ray-project/kuberay/pull/5208#discussion_r3890261932
        - --session-cache-max-memory=4Gi
        # The 2 GiB request keeps examples schedulable; size production requests to residency.
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            memory: "12Gi"
