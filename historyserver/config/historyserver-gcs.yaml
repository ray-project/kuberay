# Apply with envsubst to substitute environment variables:
#   envsubst < historyserver/config/historyserver-gcs.yaml | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: historyserver
  labels:
    app: historyserver
spec:
  selector:
    app: historyserver
  ports:
  - protocol: TCP
    name: http
    port: 30080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historyserver-demo
  labels:
    app: historyserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historyserver
  template:
    metadata:
      labels:
        app: historyserver
    spec:
      serviceAccountName: historyserver
      containers:
      - name: historyserver
        env:
          - name: GCS_BUCKET
            value: "${GCS_BUCKET}"
          - name: STORAGE_BACKEND
            value: "gcs"
        image: ${HISTORY_SERVER_IMAGE}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        # Cache is soft-bounded at 8 GiB; 12 GiB leaves decode headroom.
        # The 2 GiB request keeps examples schedulable; size production requests to residency.
        args:
        - --session-cache-max-memory=8Gi
        # Uncomment when the History Server does NOT share a namespace with the
        # Ray clusters it serves (the usual production layout). Live pass-through
        # otherwise dials the head Service by short name, which does not resolve
        # across namespaces and fails with 502; the API server proxy URL carries
        # the namespace instead. Requires the services/proxy rule in
        # config/service_account.yaml.
        # - --use-kubernetes-proxy
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            memory: "12Gi"
