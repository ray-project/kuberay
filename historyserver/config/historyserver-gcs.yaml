# Apply with envsubst to substitute environment variables:
#   envsubst < historyserver/config/historyserver-gcs.yaml | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: historyserver
  labels:
    app: historyserver
spec:
  selector:
    app: historyserver
  ports:
  - protocol: TCP
    name: http
    port: 30080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historyserver-demo
  labels:
    app: historyserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historyserver
  template:
    metadata:
      labels:
        app: historyserver
    spec:
      serviceAccountName: historyserver
      containers:
      - name: historyserver
        env:
          - name: GCS_BUCKET
            value: "${GCS_BUCKET}"
          - name: STORAGE_BACKEND
            value: "gcs"
        image: ${HISTORY_SERVER_IMAGE}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        # Soft-bound encoded snapshots at 8 GiB; leave pod memory for decoding.
        args:
        - --session-cache-max-bytes=8589934592
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            memory: "12Gi"
