name: release-python-client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Python Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build
        working-directory: clients/python-client
        run: |
          python -m pip install build
          python -m build

      - name: Upload Artifact Python Client
        uses: actions/upload-artifact@v7
        with:
          name: python_client_dist
          path: clients/python-client/dist/

  publish-pypi:
    name: Publish Python Client to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kuberay-client
    permissions:
      id-token: write
    steps:
      - name: Download Artifact Python Client
        uses: actions/download-artifact@v8
        with:
          name: python_client_dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
