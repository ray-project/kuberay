name: Track Buildkite flaky tests

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Create/update issues (leave false to validate API access)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kuberay-flaky-tracker
  cancel-in-progress: false

jobs:
  track:
    if: >-
      github.repository == 'ray-project/kuberay' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.KUBERAY_FLAKY_TRACKER_ENABLED == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Query Buildkite and track flaky tests
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          BUILDKITE_ORGANIZATION_SLUG: ray-project
          BUILDKITE_TEST_ENGINE_SUITE_SLUG: kuberay-e2e
          GH_TOKEN: ${{ github.token }}
          FLAKY_TRACKER_BRANCH: ${{ github.event.repository.default_branch }}
          FLAKY_TRACKER_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: python3 scripts/flaky_tracker.py
