{{- if .Values.webhooks.enabled }}
{{- $name := include "kuberay-operator.fullname" . }}
{{- $service := printf "%s-webhook" $name }}
{{- $cert := printf "%s-serving-cert" $name }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberay-operator.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      targetPort: webhook-server
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "kuberay-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberay-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $cert }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberay-operator.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ $service }}.{{ .Release.Namespace }}.svc
    - {{ $service }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ $name }}-selfsigned-issuer
  secretName: {{ $name }}-webhook-server-cert
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $name }}-mutating-webhook-configuration
  labels:
    {{- include "kuberay-operator.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $cert }}
webhooks:
  # fails closed, so scoped to Ray node pods
  - name: mpod.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ $service }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-v1-pod
    failurePolicy: Fail
    objectSelector:
      matchLabels:
        ray.io/is-ray-node: "yes"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    sideEffects: None
  - name: mpodbinding.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ $service }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-v1-pod-binding
    failurePolicy: Ignore
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
    sideEffects: NoneOnDryRun
    timeoutSeconds: 5
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $name }}-validating-webhook-configuration
  labels:
    {{- include "kuberay-operator.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $cert }}
webhooks:
  {{- range $kind := list "raycluster" "rayjob" "rayservice" }}
  - name: v{{ $kind }}.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ $service }}
        namespace: {{ $.Release.Namespace }}
        path: /validate-ray-io-v1-{{ $kind }}
    failurePolicy: Fail
    rules:
      - apiGroups: ["ray.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["{{ $kind }}s"]
    sideEffects: None
  {{- end }}
{{- end }}
