apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-pod-fqdn
spec:
  # podFQDN gives each Ray pod a resolvable per-pod DNS name (immutable field):
  #   <hostname>.<cluster-name>-headless.<namespace>.svc.<cluster-domain>
  # Modes:
  #   DNSOnly               - (default) only create per-pod DNS records; Ray keeps
  #                           registering with pod IPs.
  #   RegisterAsNodeAddress - also inject the FQDN as `--node-ip-address`, so Ray
  #                           nodes register by DNS name instead of pod IP.
  podFQDN:
    mode: RegisterAsNodeAddress
  enableInTreeAutoscaling: true
  # RegisterAsNodeAddress requires autoscaler v2 (the default for Ray >= 2.47).
  # v1 matches pods to Ray nodes by IP string, which never matches an FQDN:
  # scale-up still works, but idle scale-down never triggers, leaking worker pods.
  # DNSOnly works with both versions.
  # autoscalerOptions:
  #   version: v2
  #   idleTimeoutSeconds: 60
  rayVersion: "2.52.0"
  headGroupSpec:
    rayStartParams:
      # Prevent Ray actors/tasks from being scheduled on the head pod, so worker
      # scale-up/down is easy to observe.
      num-cpus: "0"
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.52.0
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "2Gi"
  workerGroupSpecs:
  - replicas: 1
    minReplicas: 0
    maxReplicas: 5
    groupName: small-group
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.52.0
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
